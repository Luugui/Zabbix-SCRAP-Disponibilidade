[GERAL]
# URL base do Zabbix.
ZABBIX_URL = https://127.0.0.1/zabbix

# Nunca versionar senha. Defina ZABBIX_USERNAME e ZABBIX_PASSWORD no ambiente
# ou no arquivo de ambiente usado pelo serviço.
USERNAME = env:ZABBIX_USERNAME
PASSWORD = env:ZABBIX_PASSWORD

# Para execução diária, coleta o dia anterior completo.
# Use PERIOD_MODE = configured para respeitar FROM e TO abaixo.
PERIOD_MODE = previous_day
FROM = 2025-07-01 00:00:00
TO = 2025-07-16 23:59:59

# Caminhos relativos ao diretório deste arquivo.
OUTPUT_DIR = reports
LOG_DIR = logs

# A primeira tentativa é imediata; as próximas esperam 60s, 120s, 240s...
MAX_ATTEMPTS = 3
RETRY_DELAY_SECONDS = 60
RETRY_BACKOFF = 2
LOG_LEVEL = INFO

[CONJUNTO_1]
pagina = SERVIDORES
TEMPLATE_NAME = ICMP Ping
TRIGGER_NAME = ICMP: Unavailable by ICMP ping
TEMPLATE_GROUP_NAME = Infraestrutura
HOSTGROUP_NAME = Servidores

[CONJUNTO_2]
pagina = REDES
TEMPLATE_NAME = Ping Router
TRIGGER_NAME = Router Offline
TEMPLATE_GROUP_NAME = Core
HOSTGROUP_NAME = Infraestrutura
